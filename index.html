<!doctype html>
<html lang="en-IE">
<head>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tonn Nua Fisheries Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow working column, a sticky progress strip, sections as numbered chart panels */
:root{
  --bg:#eef2f4; --panel:#ffffff; --ink:#14232c; --muted:#556670; --line:#cfd9de;
  --sea:#0b4f6c; --head:#0b4f6c; --sea-soft:#dcebf1; --buoy:#d9531e; --buoy-ink:#ffffff; --ok:#2e7d4f;
  --display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d171c; --panel:#15232a; --ink:#e3ecef; --muted:#93a6ae; --line:#2b3d46;
  --sea:#6cb8d6; --head:#123a4d; --sea-soft:#1b3440; --buoy:#f07a45; --buoy-ink:#1a0d06; --ok:#6cc08f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171c; --panel:#15232a; --ink:#e3ecef; --muted:#93a6ae; --line:#2b3d46;
  --sea:#6cb8d6; --head:#123a4d; --sea-soft:#1b3440; --buoy:#f07a45; --buoy-ink:#1a0d06; --ok:#6cc08f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{background:var(--head);color:#fff;padding-block:28px 22px}
header.top .wrap{padding-block:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,36px);line-height:1.1;margin:.25em 0 .2em;text-wrap:balance}
header.top p{margin:0;max-width:60ch;opacity:.92}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-direction:column;gap:8px;padding-block:8px}
.bar .row{display:flex;gap:10px;align-items:center;min-width:0}
.jumpwrap{flex:1;min-width:0}
.bar .jump{margin-top:0;flex-wrap:nowrap}
.bar .jump label{white-space:nowrap;font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink)}
.bar .jump select{border:2px solid var(--buoy);background:var(--sea-soft);color:var(--ink);font-weight:600;font-size:16px;padding:10px 12px;box-shadow:0 0 0 3px color-mix(in srgb,var(--buoy) 22%,transparent)}
.bar .jump select:focus-visible{outline:3px solid var(--buoy);outline-offset:2px}
.meter{flex:1;height:8px;background:var(--sea-soft);border-radius:4px;overflow:hidden;min-width:0}
.meter span{display:block;height:100%;background:var(--sea);width:0;transition:width .3s}
.bar small{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.bar .home{flex:none;padding:8px 10px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);cursor:pointer}
section.sec{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-top:20px}
section.sec>summary,section.sec>.head{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:12px;align-items:baseline}
section.sec summary::-webkit-details-marker{display:none}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.secno{font-family:var(--mono);color:var(--sea);font-size:13px;flex:none}
.sectitle{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.25}
.secbody{padding:0 18px 18px;display:grid;gap:18px}
.note{color:var(--muted);font-size:14.5px;max-width:65ch;margin:0}
.q{display:grid;gap:8px}
.q label.lab, .q .lab{font-weight:500}
.q .lab b{font-family:var(--mono);color:var(--sea);font-weight:500;margin-right:6px}
input[type=text],input[type=number],input[type=email],input[type=tel],textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,.chip input:focus-visible+span{outline:3px solid var(--buoy);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:15px;user-select:none}
.chip input:checked+span{background:var(--sea);border-color:var(--sea);color:#fff}
:root[data-theme="dark"] .chip input:checked+span{color:#0d171c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip input:checked+span{color:#0d171c}}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pair label{display:grid;grid-template-rows:1fr auto;gap:4px;font-size:14px;color:var(--muted)}
.pair label.wide{grid-column:1/-1}
.cond.off{opacity:.45}
.cond.off *{cursor:not-allowed}
.pair label:has(input[data-otherof]:not([hidden])){grid-template-rows:1fr auto auto}
.scale{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
.scale table{border-collapse:collapse;width:100%;font-size:14px}
.scale td,.scale th{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.scale th{font-family:var(--mono);font-weight:500;color:var(--sea);font-size:12.5px}
.items{display:grid;gap:10px}
.group{font-family:var(--display);font-weight:700;font-size:15.5px;color:var(--sea);margin-top:6px}
.item{border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:grid;gap:8px;background:var(--bg)}
.item .t{font-size:15px}
.item .t b{font-family:var(--mono);font-weight:500;color:var(--sea);margin-right:6px}
.item .row{display:grid;grid-template-columns:1fr;gap:8px}
.item .row.two{grid-template-columns:1fr}
.q select,.pair select{width:100%;min-width:0;padding:9px 10px;font-family:var(--body);font-size:15px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px}
[hidden]{display:none!important}
.reg{margin-top:10px;border:1px solid var(--line);border-left:4px solid var(--sea);border-radius:4px;padding:10px 12px;background:var(--bg)}
.reg .regh{font-family:var(--mono);font-size:12.5px;color:var(--sea);margin-bottom:6px}
.reg dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:14px}
.reg dt{color:var(--muted)}
.reg dd{margin:0;min-width:0;overflow-wrap:anywhere}
.reg .regn{font-size:12.5px;color:var(--muted);margin-top:8px}
.sub{display:grid;gap:6px;margin-top:8px;font-size:14px;color:var(--muted)}
.item select{padding:9px 10px;background:var(--panel);width:100%;min-width:0;font-family:var(--body);font-size:15px;letter-spacing:0}
.item label{display:grid;gap:6px}
.item .qq{font-size:14.5px;color:var(--ink);line-height:1.35}
.guide{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14.5px}
.item .row{gap:14px!important}
.callout{border-left:4px solid var(--buoy);background:var(--sea-soft);padding:12px 14px;border-radius:0 4px 4px 0;font-size:15px}
.send{margin-top:24px;background:var(--panel);border:2px solid var(--sea);border-radius:6px;padding:18px;display:grid;gap:14px}
.send h2{font-family:var(--display);font-size:22px;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button:disabled{opacity:.4;cursor:not-allowed}
button.x{padding:4px 10px;font-size:13px;margin-left:6px}
button{font:inherit;font-weight:600;border-radius:4px;padding:11px 16px;border:1px solid var(--sea);background:var(--panel);color:var(--sea);cursor:pointer}
button.primary{background:var(--buoy);border-color:var(--buoy);color:var(--buoy-ink)}
.rcpts{display:grid;gap:8px}
.rcpt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--bg)}
.rcpt input{width:20px;height:20px;margin-top:2px;flex:none}
.rcpt .addr{border:0;padding:0;background:none;font-size:13px}
.addr{font-family:var(--mono);font-size:14px;user-select:all;word-break:break-all;background:var(--bg);border:1px solid var(--line);padding:8px 10px;border-radius:4px}
.status{font-size:14.5px;color:var(--ok);min-height:1.4em}
.status.err{color:var(--buoy)}
pre.out{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12.5px;max-height:240px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;margin:0}
.saved{font-family:var(--mono);font-size:12px;color:var(--muted)}

section.sec{padding-bottom:4px}
.step[hidden]{display:none!important}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:0 18px 18px}
.nav .pos{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.jump{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.jump select{flex:1;min-width:0;padding:8px 10px;font:inherit;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="eyebrow">Seaview Marine · <span id="verHead">Form V0.3, 19 October 2026</span></div>
  <h1>Tonn Nua Survey Programme: Fisheries Consultation</h1>
  <p>One form per vessel, in short pages. Fill in what applies to you and skip the rest; press <strong>Next</strong> to move on. Your answers are kept on this phone as you go.</p>
</div></header>

<div class="bar"><div class="wrap">
  <div class="row"><div id="jumpWrap" class="jumpwrap"></div></div>
  <div class="row"><div class="meter" aria-hidden="true"><span id="meter"></span></div><small id="count">0 answered</small><small class="ver" id="verBar">V0.3</small><button type="button" class="home" id="themeBtn">Light mode</button></div>
</div></div>

<main class="wrap" id="form"></main>

<script>
/* ---------- settings: the three addresses the answers go to ---------- */
const ASSESSOR="Michael@Mkeatinge.onmicrosoft.com";
/* answers go only to the independent assessor */
const RECIPIENTS = [{name:"Seaview Marine (independent assessor)", email:ASSESSOR}];
const FORM_VERSION = "V0.3 online";
const FORM_DATE = "19 October 2026";
/* light / dark switch, remembered on this phone */
(function(){const R=document.documentElement,K="nisa-theme";
  const isDark=()=>R.dataset.theme?R.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const lab=()=>{const b=document.getElementById("themeBtn");if(b)b.textContent=isDark()?"Light mode":"Dark mode"};
  try{const t=localStorage.getItem(K);if(t)R.dataset.theme=t}catch(e){}
  lab();matchMedia("(prefers-color-scheme: dark)").addEventListener("change",lab);
  document.getElementById("themeBtn").addEventListener("click",()=>{const t=isDark()?"light":"dark";R.dataset.theme=t;try{localStorage.setItem(K,t)}catch(e){}lab()});
})();
{const v=FORM_VERSION.split(" ")[0];document.getElementById("verHead").textContent="Form "+v+", "+FORM_DATE;document.getElementById("verBar").textContent=v;}

/* ---------- form definition (mirrors Consultation Instrument V1.1) ---------- */
const MONTHS=["J","F","M","A","M","J","J","A","S","O","N","D"];
const MONTH_NAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const SEV=["1 Hardly at all","2 A cost, but I manage","3 Cuts earnings or how I work","4 Puts the season at risk","5 Could force me out","6 Does not apply to me"];
const REC=["R1 Within the trip or week","R2 Within the season","R3 The following season","R4 Not before the next campaign","R5 Still not back to normal"];
const LIK=["1 Very unlikely","2 Unlikely","3 Could go either way","4 Likely","5 Almost certain","6 Does not apply to me"];
const CON=["1 Not at all","2 A nuisance only","3 Cuts earnings or how I fish","4 Puts my finances at risk","5 Could force me out","6 Does not apply to me"];

const SECTIONS=[
{id:"intro",no:"",title:"About this form",open:true,html:`
<p class="note">ESB has commissioned an independent assessment of what its 2026 and 2027 survey programme for the Tonn Nua offshore wind farm, off Co. Waterford, costs the fishing industry of the south coast. The assessment is being carried out by Seaview Marine, which is independent of ESB and of the developer.</p>
<p class="note">The assessment cannot be done from official data alone. Landings and effort records do not resolve to an area the size of the survey ground, and for vessels under ten metres there is no official record of where fishing takes place at all. What the ground is worth, when it can be worked, and what happens to a boat when it is closed are known only to the people who fish it. That is what this form is for.</p>
<p class="note">One form per vessel. It is for vessels that fish inside the survey area and for those that fish the grounds next to it, because gear moved out of the survey area lands on their ground. If a question does not apply to you, skip it.</p>
<div class="callout"><strong>Your answers.</strong> They are held by Seaview Marine (the independent assessor) and are not passed to ESB or to the developer. Every result is reported in aggregate, by fleet segment and gear, and no vessel can be identified. Completing the form is not a condition of any payment under ESB's co-operation arrangement. You may withdraw up to the delivery of the report. Section 8 gives the full data protection statement.</div>
<p class="note">Some concerns are about the wind farm itself and not about the surveys. They are outside this assessment, but they are recorded in Section 6 and passed to the Fisheries Management and Mitigation Strategy so that they do not have to be gathered again.</p>
<p class="note">Nothing is sent until you press <strong>Send answers</strong>. Your answers are kept on this device as you go, so you can close the page and come back to it.</p>`},

{id:"s1",no:"1",title:"Vessel and respondent",note:"Not reported, and not passed to ESB or to the developer.",fields:[
 {k:"vessel",t:"vessel",q:"Your vessel"},
 {k:"loa",t:"pair",q:"Length overall and fleet segment",parts:[{l:"Length overall",o:["Under 8 m","8 to 9.9 m","10 to 11.9 m","12 to 14.9 m","15 to 17.9 m","18 m or over"]},{l:"Fleet segment",o:["Polyvalent, under 18 m","Polyvalent, 18 m and over","Specific (scallop)","Beam trawl","RSW pelagic","Other","Don't know"]}]},
 {k:"gear",t:"pair",q:"Principal and secondary gear",parts:[{l:"Principal gear",o:["Pots (crab and lobster)","Whelk pots","Shrimp pots","Gill or tangle nets","Hand lines or jigs","Otter trawl","Pelagic trawl","Beam trawl","Dredge","Other"]},{l:"Secondary gear",o:["None","Pots (crab and lobster)","Whelk pots","Shrimp pots","Gill or tangle nets","Hand lines or jigs","Otter trawl","Pelagic trawl","Beam trawl","Dredge","Other"]}]},
 {k:"species",t:"multi",q:"Principal target species (choose any)",opts:["Crab","Lobster","Whelk","Shrimp","Crayfish","Mackerel","Pollack","Whitefish","Scallop","Other"]},
 {k:"where",t:"choice",q:"Where the vessel fishes",opts:["Inside the survey area","Next to it","Both"]},
 {k:"fishwith",t:"choice",q:"Do you fish with:",opts:["Pots","Nets","Both"]},
 {k:"pots",t:"pair",when:["fishwith",["Pots","Both"],"hide"],q:"Pots normally worked, and how many of them inside the survey area",parts:[{l:"Total",o:["None","Under 100","100 to 249","250 to 499","500 to 999","1,000 or more"]},{l:"Inside the survey area",o:["None","Under 100","100 to 249","250 to 499","500 to 999","1,000 or more","Don't know"]}]},
 {k:"nets",t:"pair",when:["fishwith",["Nets","Both"],"hide"],q:"Fleets of nets normally worked, and how many of them inside the survey area",parts:[{l:"Total",o:["None","1 to 2","3 to 5","6 to 10","11 to 20","More than 20"]},{l:"Inside the survey area",o:["None","1 to 2","3 to 5","6 to 10","11 to 20","More than 20","Don't know"]}]},
 {k:"landport",t:"multi",q:"Usual landing port or ports",opts:["Dunmore East","Helvick","Dungarvan","Ardmore","Youghal","Boatstrand","Passage East","Kilmore Quay","Ballycotton","Other"]},
 {k:"homeport",t:"sel",q:"Home port",opts:["Dunmore East","Helvick","Dungarvan","Ardmore","Youghal","Boatstrand","Passage East","Kilmore Quay","Ballycotton","Other"]},
 {k:"crew",t:"sel",q:"Number of crew, including the skipper",opts:["1","2","3","4","5","6","7","8 or more"]},
 {k:"years",t:"sel",q:"Years you have fished this ground",opts:["Under 5","5 to 9","10 to 19","20 to 29","30 or more"]},
 {k:"resp",t:"pair",q:"Your name and role",parts:["Name",{l:"Role",o:["Owner","Skipper","Owner and skipper","Other"]}]},
 {k:"contact",t:"text",q:"Contact number or email"},
 {k:"po",t:"sel",q:"Producer organisation membership",opts:["NIFA","SERIFF","IS&EFPO","IS&WFPO","KFO","IFPO","None","Other"]}
]},

{id:"s2a",no:"2a",title:"The value at stake",note:"These answers are the most important part of the form. They show what is at stake on the ground affected.",fields:[
 {k:"q1",n:1,t:"choice",q:"Do you fish, or have you fished, inside the survey area?",opts:["Yes","No","Occasionally"]},
 {k:"q2",n:2,t:"choice",q:"Typical gross landings in a year, by value, before costs",opts:["Under €50k","€50–100k","€100–150k","€150–250k","Over €250k"]},
 {k:"q2x",t:"text",q:"Exact figure, if you are willing (€)"},
 {k:"q3",n:3,t:"sel",q:"Roughly what share of the year's gross earnings comes from inside the survey area?",opts:["None (0%)","1 to 10%","11 to 25%","26 to 50%","51 to 75%","76 to 99%","All (100%)","Don't know"]},
 {k:"q4",n:4,t:"months",q:"In which months do you work it?"},
 {k:"q4p",t:"months",q:"Which are the peak months?"},
 {k:"q5",n:5,t:"pair",q:"Gross landings by value in August and in September of a typical year",parts:[{l:"August",o:["Under €2,500","€2,500 to €4,999","€5,000 to €9,999","€10,000 to €19,999","€20,000 to €39,999","€40,000 or more","Don't know"]},{l:"September",o:["Under €2,500","€2,500 to €4,999","€5,000 to €9,999","€10,000 to €19,999","€20,000 to €39,999","€40,000 or more","Don't know"]}]},
 {k:"q6",n:6,t:"sel",q:"What share of those two months' landings comes from inside the survey area?",opts:["None (0%)","1 to 10%","11 to 25%","26 to 50%","51 to 75%","76 to 99%","All (100%)","Don't know"]},
 {k:"q7",n:7,t:"pair",q:"What do you take inside the survey area, as a share of its value?",parts:["Crab","Lobster","Whelk","Shrimp","Other"].map(l=>({l,o:["None (0%)","1 to 10%","11 to 25%","26 to 50%","51 to 75%","76 to 99%","All (100%)","Don't know"]}))},
 {k:"q8",n:8,t:"choicetext",q:"Are there days of tide or weather when it is the only ground you can work? Describe.",opts:["Yes","No"]},
 {k:"q9",n:9,t:"choice",q:"Which area do you understand to be closed: the licence area, or the smaller designated site?",opts:["Licence area","Designated site","Not sure"]},
 {k:"q10",n:10,t:"choice",q:"If the survey works the area in blocks rather than all at once, could you keep fishing the part not being surveyed?",opts:["Yes","No","Don't know"]},
 {k:"q11a",n:11,t:"choice",q:"Do you hold chart plotter tracks or other records of where you fish?",opts:["Yes","No"]},
 {k:"q11b",t:"choice",q:"Would you provide a plotter download?",opts:["Yes","No"]}
]},

{id:"s2b",no:"2b",title:"What you could make up",note:"For vessels that fish inside the survey area.",fields:[
 {k:"q12",n:12,t:"multi",q:"If you were kept off the survey area for the survey window, where would you go? (choose any)",opts:["Inshore ground nearby","Further along the coast","Offshore of the survey area","Nowhere suitable","Stay ashore"]},
 {k:"q13",n:13,t:"sel",q:"How far is that ground? (steaming each way)",opts:["Under 1 hour","1 to 2 hours","2 to 3 hours","3 to 4 hours","Over 4 hours"]},
 {k:"q14",n:14,t:"choicesel",q:"Would it give the same catch per pot (or per haul)?",opts:["Better","Same","Worse"],dl:"By roughly how much?",dopts:["Under 10%","10 to 24%","25 to 49%","50% or more","Don't know"]},
 {k:"q15",n:15,t:"sel",q:"Of every €100 you would normally take inside the survey area in the survey month, how much would you expect to make up elsewhere?",opts:["Nothing","€1 to €24","€25 to €49","€50 to €74","€75 to €99","All €100","Don't know"]},
 {k:"q16",n:16,t:"pair",q:"How many fishing days would be lost moving gear out before the survey, and back after it?",parts:[{l:"Moving out",o:["None","1 day","2 days","3 days","4 to 5 days","6 to 10 days","More than 10 days"]},{l:"Moving back",o:["None","1 day","2 days","3 days","4 to 5 days","6 to 10 days","More than 10 days"]}]},
 {k:"q17",n:17,t:"pair",q:"What share of the pots inside would you move to other ground, and what share would you take ashore?",parts:[{l:"Moved",o:["None (0%)","1 to 10%","11 to 25%","26 to 50%","51 to 75%","76 to 99%","All (100%)","Don't know"]},{l:"Taken ashore",o:["None (0%)","1 to 10%","11 to 25%","26 to 50%","51 to 75%","76 to 99%","All (100%)","Don't know"]}]},
 {k:"q18",n:18,t:"sel",q:"Extra cost of moving and working other ground over the campaign (fuel, crew days, gear lost)",opts:["None","Under €500","€500 to €999","€1,000 to €2,499","€2,500 to €4,999","€5,000 to €9,999","€10,000 or more","Don't know"]},
 {k:"q19",n:19,t:"choicesel",q:"Could you make up lost fishing before or after the closure?",opts:["Yes","No"],dl:"To what extent?",dopts:["None (0%)","1 to 10%","11 to 25%","26 to 50%","51 to 75%","76 to 99%","All (100%)","Don't know"]}

{id:"s8",no:"8",title:"Consent and data protection",note:"",html:`
<p class="note">This assessment can be built from aggregated data that needs no consent from you, but it is more accurate if it can use your own records. The Sea-Fisheries Protection Authority releases vessel-level sales notes, logbook records and VMS data only with the owner's written consent. Anything obtained is subject to strict rules, is reported only in aggregate, and no vessel can be identified in the report.</p>
<p class="note"><strong>Data controller.</strong> Seaview Marine, the independent assessor, is the data controller for this form and anything obtained under the consents below. <strong>Legal basis.</strong> Your consent. You may withdraw it at any time up to the delivery of the report, and everything held about you and your vessel is then deleted. <strong>Retention.</strong> Identifying material (this form, your contact details, any plotter track, and any vessel-level records from the SFPA) is deleted six weeks after the impact assessment is accepted by ESB, or six months from the date of this form, whichever is first. The aggregated figures in the report are kept, because no vessel can be identified from them. <strong>Who sees it.</strong> Seaview Marine holds it and uses it only for this assessment. Nothing is passed to ESB, the developer or any other party. The names of any buyers, processors or agents you give are used only in the analysis and are never reported. Your telephone number and email address are used only to confirm that this submission came from you, and are never reported or passed on. <strong>Your rights.</strong> You may ask to see, correct or delete what is held, and you may complain to the Data Protection Commission at www.dataprotection.ie.</p>
<p class="note"><strong>Security code.</strong> Choose a word and a number below and write them down or remember them. Before your answers are used, Seaview Marine will phone you on the number you give below and ask you to confirm this code, so that nobody can send a form in your vessel's name. Do not use a PIN or password you use for anything else.</p>`,fields:[
 {k:"con_sales",t:"choice",q:"I consent to Seaview Marine obtaining my sales note records for the reference period.",opts:["Yes","No"]},
 {k:"con_log",t:"choice",q:"I consent to Seaview Marine obtaining my vessel's logbook records for the reference period.",opts:["Yes","No"]},
 {k:"con_vms",t:"choice",q:"I consent to Seaview Marine obtaining my VMS data for the reference period.",opts:["Yes","No"]},
 {k:"con_plot",t:"choice",q:"I am willing to provide a chart plotter download showing where I fish.",opts:["Yes","No"]},
 {k:"con_contact",t:"choice",q:"I am willing to be contacted again if a point needs to be checked.",opts:["Yes","No"]},
 {k:"con_read",t:"choice",q:"I have read the data protection statement above and understand what is held, who sees it, and when it is deleted.",opts:["Yes"]},
 {k:"con_name",t:"text",q:"Your name, typed, in place of a signature"},
 {k:"con_phone",t:"tel",q:"Your telephone number",help:"This is the number we will call to confirm that this submission came from you. Please give a number you will answer."},
 {k:"con_email",t:"email",q:"Your email address (optional)"},
 {k:"seccode",t:"pair",q:"Your security code (a word and a number)",parts:[{l:"Word",o:["Anchor","Beacon","Buoy","Compass","Dolphin","Gannet","Harbour","Herring","Island","Lighthouse","Lobster","Mackerel","Mussel","Oyster","Puffin","Rudder","Seal","Skerry","Tern","Tide","Whale","Wreck"]},{l:"Number",o:Array.from({length:90},(_,i)=>String(i+10))}]}
]},

/* ---------- state ---------- */
const KEY="tonnnua-fisheries-form-v1";
let S={};
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){S={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));document.getElementById("savedAt").textContent="Saved on this device "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}catch(e){} progress()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------- render ---------- */
const root=document.getElementById("form");
function fieldHTML(f){
  const id="f_"+f.k, lab=`<div class="lab">${f.n?`<b>Q${f.n}</b>`:""}${esc(f.q)}</div>`;
  if(f.t==="text") return `<div class="q"><label class="lab" for="${id}">${f.n?`<b>Q${f.n}</b>`:""}${esc(f.q)}</label><input type="text" id="${id}" data-k="${f.k}"></div>`;
  if(f.t==="tel"||f.t==="email") return `<div class="q"><label class="lab" for="${id}">${esc(f.q)}</label><input type="${f.t}" id="${id}" data-k="${f.k}" autocomplete="${f.t==="tel"?"tel":"email"}">${f.help?`<p class="note" style="margin:0;font-size:13.5px">${esc(f.help)}</p>`:""}</div>`;
  if(f.t==="textarea") return `<div class="q"><label class="lab" for="${id}">${f.n?`<b>Q${f.n}</b>`:""}${esc(f.q)}</label><textarea id="${id}" data-k="${f.k}"></textarea></div>`;
  if(f.t==="choice"||f.t==="multi"){const type=f.t==="multi"?"checkbox":"radio";
    return `<fieldset class="q" style="border:0;padding:0;margin:0"><legend class="lab" style="padding:0">${f.n?`<b>Q${f.n}</b>`:""}${esc(f.q)}</legend><div class="chips">${f.opts.map((o,i)=>`<label class="chip"><input type="${type}" name="${id}" id="${id}_${i}" data-k="${f.k}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div></fieldset>`}
  if(f.t==="choicetext") return `<fieldset class="q" style="border:0;padding:0;margin:0"><legend class="lab" style="padding:0">${f.n?`<b>Q${f.n}</b>`:""}${esc(f.q)}</legend><div class="chips">${f.opts.map((o,i)=>`<label class="chip"><input type="radio" name="${id}" id="${id}_${i}" data-k="${f.k}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div><input type="text" id="${id}_d" data-k="${f.k}__d" aria-label="Details" placeholder="Details"></fieldset>`;
  if(f.t==="months") return `<fieldset class="q" style="border:0;padding:0;margin:0"><legend class="lab" style="padding:0">${f.n?`<b>Q${f.n}</b>`:""}${esc(f.q)}</legend><div class="chips">${MONTH_NAMES.map((m,i)=>`<label class="chip"><input type="checkbox" name="${id}" id="${id}_${i}" data-k="${f.k}" value="${m}"><span>${m}</span></label>`).join("")}</div></fieldset>`;
  if(f.t==="vessel"){const opt=v=>{const lab=v.n+(v.p?" ("+v.p+")":"");const val=lab+", "+v.c;return `<option value="${esc(val)}" data-own="${esc(v.o||"")}" data-loa="${v.loa??""}" data-seg="${esc(v.segf||"")}">${esc(lab)}</option>`};
    const by=(f2)=>VESSELS.filter(f2).sort((a,b)=>a.n.localeCompare(b.n)).map(opt).join("");
    return `<div class="q"><label class="lab" for="${id}">${esc(f.q)}</label><select id="${id}" data-k="vessel"><option value="">Choose your vessel</option>${["Under 18 m, owners in Wexford, Waterford and Cork","All other vessels"].map(g=>`<optgroup label="${esc(g)}">${by(v=>(v.grp||"Vessels")===g)}</optgroup>`).join("")}<option value="Not on the list">Not on the list</option></select><div class="reg" id="vesselReg" hidden></div><label class="sub" id="vesselOtherWrap" for="${id}_o" hidden>Vessel name and registration<input type="text" id="${id}_o" data-k="vessel__other"></label></div>`}
  if(f.t==="sel") return `<div class="q"><label class="lab" for="${id}">${f.n?`<b>Q${f.n}</b>`:""}${esc(f.q)}</label>${selHTML(id,f.k,f.opts,"Choose an answer")}</div>`;
  if(f.t==="choicesel") return `<fieldset class="q" style="border:0;padding:0;margin:0"><legend class="lab" style="padding:0">${f.n?`<b>Q${f.n}</b>`:""}${esc(f.q)}</legend><div class="chips">${f.opts.map((o,i)=>`<label class="chip"><input type="radio" name="${id}" id="${id}_${i}" data-k="${f.k}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div><label class="sub" for="${id}_d">${esc(f.dl)}${selHTML(id+"_d",f.k+"__d",f.dopts,"Choose an answer")}</label></fieldset>`;
  if(f.t==="pair") return `<div class="q">${lab}<div class="pair">${f.parts.map((p,i)=>`<label for="${id}_${i}"${p.wide?' class="wide"':""}><span>${esc(typeof p==="string"?p:p.l)}</span>${typeof p==="string"?`<input type="text" id="${id}_${i}" data-k="${f.k}__${i}">`:selHTML(id+"_"+i,f.k+"__"+i,p.o,"Choose")}${p.other?`<input type="text" id="${id}_${i}o" data-k="${f.k}__${i}o" data-otherof="${f.k}__${i}" data-otherval="${esc(p.other)}" placeholder="Name the event and who carried it out" hidden>`:""}</label>`).join("")}</div></div>`;
  return "";
}
function selHTML(id,k,opts,ph){return `<select id="${id}" data-k="${k}"><option value="">${ph}</option>${opts.map(o=>`<option>${esc(o)}</option>`).join("")}</select>`}
function ratingItem(code,text){const b="r_"+code.replace(".","_");
  return `<div class="item"><div class="t"><b>${code}</b>${esc(text)}</div><div class="row">

  for(const s of SECTIONS){
    const before=L.length; L.push("");L.push("== "+(s.lab?"":(s.no?("SECTION "+s.no+": "):""))+s.title.toUpperCase()+" ==");const head=L.length;
    if(s.items) for(const [g,list] of s.items) for(const [c,t] of list){const b=val(c+"__basis"),sv=val(c+"__sev"),r=val(c+"__rec");if(b||sv||r)L.push(c+" "+t+" | basis "+(b||"-")+" | severity "+(sv||"-")+" | recovery "+(r||"-"))}
    if(s.lc) for(const [c,t] of s.lc){const l=val(c+"__lik"),cn=val(c+"__con");if(l||cn)L.push(c+" "+t+" | likelihood "+(l||"-")+" | concern "+(cn||"-"))}
    if(s.top3){const nm=c=>{for(const x of SECTIONS){for(const g of (x.items||[]))for(const [k,t] of g[1])if(k===c)return c+" "+t;for(const [k,t] of (x.lc||[]))if(k===c)return c+" "+t}return c};["First","Second","Third"].forEach((x,i)=>{const v=val("top3__"+i);add(x+" item",v?nm(v):"")});for(const [c,t] of IMPACTS){const r=[0,1,2].map(i=>val(c+"__"+i));if(r.some(Boolean))L.push(c+" "+t+" | "+r.map((x,i)=>["First","Second","Third"][i]+" "+(x||"-")).join(" | "))}}
    if(s.fields) for(const f of s.fields){const q=(f.n?"Q"+f.n+" ":"")+f.q;
      if(f.t==="pair"){const parts=f.parts.map((p,i)=>[typeof p==="string"?p:p.l,(p.other&&val(f.k+"__"+i)===p.other)?(val(f.k+"__"+i+"o")?"Other: "+val(f.k+"__"+i+"o"):"Other"):val(f.k+"__"+i)]).filter(x=>x[1]);if(parts.length)L.push(q+": "+parts.map(x=>x[0]+" = "+x[1]).join("; "))}
      else if(f.t==="vessel"){const v=val("vessel");add(q,v==="Not on the list"?(val("vessel__other")||v):v);const r=regInfo(S.vessel);if(r)L.push("From the fleet register: "+r.map(([a,b])=>a+" = "+b).join("; "))}
      else if(f.t==="choicetext"||f.t==="choicesel"){const a=val(f.k),d=val(f.k+"__d");if(a||d)L.push(q+": "+[a,d].filter(Boolean).join(". "))}
      else add(q,val(f.k));}
    if(L.length===head){if(s.fields||s.items||s.lc||s.top3)L.push("Not answered");else L.length=before}
  }
  L.push("");L.push("---- DATA FOR THE COLLATOR (please do not edit below this line) ----");
  const clean=x=>String(x).replace(/\[/g,"(").replace(/\]/g,")").replace(/\s*\n\s*/g," / ").trim();
  const D=["[[tonnnua="+FORM_VERSION+"]]","[[sent="+new Date().toISOString()+"]]","[[to="+clean(chosen().map(r=>r.email).join(", "))+"]]"];
  root.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;if(D.some(x=>x.startsWith("[["+k+"=")))return;const v=val(k);if(v)D.push("[["+k+"="+clean(v)+"]]")});
  D.push("[[end]]");L.push(D.join(" "));
  return L.join("\n");
}
/* ---------- actions ---------- */
function status(msg,err){const s=document.getElementById("status");s.textContent=msg;s.className="status"+(err?" err":"")}
function refreshPreview(){document.getElementById("preview").textContent=buildText()}
function toIdx(){const all=RECIPIENTS.map((_,j)=>j);const t=(S._to||[]).filter(i=>i<RECIPIENTS.length);return t.length?t:all}
function chosen(){return RECIPIENTS}
function updClear(){const b=document.getElementById("btnClear");if(b)b.disabled=!S._saved}
function wire(){
  const doSend=()=>{
    document.getElementById("sendCheck").hidden=true;
    const body=buildText();refreshPreview();
    const vessel=(val("vessel")==="Not on the list"?val("vessel__other"):val("vessel").split(",")[0])||"vessel";
    const to=chosen();if(!to.length){status("Tick at least one person to send to.",true);return}
    const href="mailto:"+to.map(r=>r.email).join(",")+"?subject="+encodeURIComponent("Tonn Nua fisheries consultation: "+vessel)+"&body="+encodeURIComponent(body);
    try{location.href=href}catch(e){}
    status("If your email app opened, check the message and press send there. If nothing opened, press Save a copy and attach the file to an email to Seaview Marine.");
  };
  document.getElementById("btnSend").addEventListener("click",()=>{
    const pg=id=>SECTIONS.findIndex(x=>x.id===id);const miss=[];
    if(!val("vessel"))miss.push(["your vessel",pg("s1")]);
    if(!val("seccode__0")||!val("seccode__1"))miss.push(["your security code",pg("s8")]);
    if(!val("con_name"))miss.push(["your typed name",pg("s8")]);
    if(!val("con_phone"))miss.push(["your telephone number, so we can confirm the submission",pg("s8")]);
    if(val("con_read")!=="Yes")miss.push(["confirming you have read the data protection statement",pg("s8")]);
    const empty=SECTIONS.filter((x,i)=>i>0&&(x.fields||x.items||x.lc||x.top3)&&!Object.keys(S).some(k=>filled(S[k])&&document.querySelector(`#${x.id} [data-k="${CSS.escape(k)}"]`))).length;
    if(!miss.length){doSend();return}
    const box=document.getElementById("sendCheck");
    box.innerHTML=`<strong>Before you send.</strong> Your answers can be sent as they are, even if some pages are not finished${empty?` (${empty} page${empty>1?"s have":" has"} no answers yet)`:""}. But these are needed to use them:<ul class="guide">${miss.map(([t,i])=>`<li>${t} <button type="button" class="x" data-go="${i}">Go to page ${i+1}</button></li>`).join("")}</ul><div class="btns" style="margin-top:8px"><button type="button" class="primary" id="sendAnyway">Send anyway</button></div>`;
    box.hidden=false;document.getElementById("sendAnyway").onclick=doSend;
  });
  document.getElementById("btnClear").addEventListener("click",()=>{document.getElementById("confirmClear").hidden=false});
  document.getElementById("noClear").addEventListener("click",()=>{document.getElementById("confirmClear").hidden=true});
  document.getElementById("yesClear").addEventListener("click",()=>{S={};try{localStorage.removeItem(KEY)}catch(e){}render();wire();progress();status("The form has been cleared.")});
  document.querySelector("#send details").addEventListener("toggle",refreshPreview);
  // Save a copy: Claude downloads capability when present, otherwise an ordinary browser download
  let DLc=null;(async()=>{try{DLc=window.claude&&await window.claude.use("downloads")}catch(e){DLc=null}})();
  document.getElementById("btnSave").addEventListener("click",async()=>{
    const text=buildText();refreshPreview();
    const name="Tonn-Nua-consultation-"+((val("vessel")||"vessel").split(",")[0]).replace(/[^A-Za-z0-9-]+/g,"-").replace(/-+$/,"")+"-"+new Date().toISOString().slice(0,10)+".txt";
    try{
      if(DLc){await DLc.save({filename:name,data:text})}
      else{const u=URL.createObjectURL(new Blob([text],{type:"text/plain"}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
      S._saved=true;save();updClear();status("A copy has been saved to this device as \u201c"+name+"\u201d. Attach it to an email to "+ASSESSOR+".");
    }catch(e){status("The copy was not saved.",true)}
  });
  updClear();
}
render();wire();progress();
</script>
